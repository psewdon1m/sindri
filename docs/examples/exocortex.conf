server_tokens off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_status 429;
limit_conn_status 429;
limit_req_zone $binary_remote_addr zone=kernel_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=kernel_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=perimetr_general:10m rate=60r/s;
limit_req_zone $binary_remote_addr zone=perimetr_login:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=kernel_connections:10m;
limit_conn_zone $binary_remote_addr zone=perimetr_connections:10m;
proxy_headers_hash_max_size 1024;
proxy_headers_hash_bucket_size 128;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:EXOCORTEX_TLS:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

server {
    listen 80;
    listen [::]:80;
    server_name kernel.example.com;
    return 301 https://kernel.example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kernel.example.com;

    ssl_certificate /etc/letsencrypt/live/kernel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kernel.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    client_max_body_size 3m;
    limit_req zone=kernel_general burst=40 nodelay;
    limit_conn kernel_connections 30;

    location = /api/auth/login {
        client_max_body_size 16k;
        limit_req zone=kernel_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:18180;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }

    location = /api/backup/restore {
        client_max_body_size 34m;
        proxy_pass http://127.0.0.1:18180;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_read_timeout 300s;
    }

    # This endpoint is for the local Updater only and must never be public.
    location = /api/internal/updater/restore {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:18180;
        proxy_http_version 1.1;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name perimetr.example.com;
    return 301 https://perimetr.example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name perimetr.example.com;

    ssl_certificate /etc/letsencrypt/live/perimetr.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/perimetr.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    client_max_body_size 8m;
    limit_req zone=perimetr_general burst=120 nodelay;
    limit_conn perimetr_connections 60;

    location = /v1/auth/direct {
        client_max_body_size 16k;
        limit_req zone=perimetr_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:18080;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }

    location = /v1/backups/import {
        client_max_body_size 130m;
        proxy_pass http://127.0.0.1:18080;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_read_timeout 600s;
    }

    # This endpoint is for the local Updater only and must never be public.
    location = /v1/internal/updater/restore {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}
