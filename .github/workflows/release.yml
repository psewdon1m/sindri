name: Release Sindri

on:
  push:
    tags:
      - "sindri-v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache: true
      - name: Resolve version
        id: release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#sindri-v}"
          [[ "$GITHUB_REF_NAME" == "sindri-v${version}" ]]
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Test
        run: |
          sh -n install.sh
          go test ./...
      - name: Build release artifacts
        run: bash scripts/build-release.sh "${{ steps.release.outputs.version }}"
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: "release-artifacts/*"
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-artifacts/* \
            --verify-tag --latest=false --generate-notes \
            --title "Sindri ${{ steps.release.outputs.version }}"
      - name: Refresh discovery release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release delete sindri-current --cleanup-tag --yes || true
          git tag --force sindri-current "$GITHUB_SHA"
          git push --force origin refs/tags/sindri-current
          gh release create sindri-current \
            release-artifacts/sindri-release-manifest.json \
            --verify-tag --latest=false \
            --title "Sindri current (${{ steps.release.outputs.version }})" \
            --notes "Discovery pointer to sindri-v${{ steps.release.outputs.version }}."
